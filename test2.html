<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>اختبار الميزان v17</title>
</head>
<body>
    <h1>اختبار الميزان v17</h1>
    <div id="results" style="font-family: monospace; padding: 20px; background: #f5f5f5; border-radius: 8px; margin: 20px;"></div>

    <script src="core.js"></script>
    <script src="app.js"></script>
    <script>
        setTimeout(function() {
            const r = document.getElementById('results');
            const tests = [
                ['core.js محمّل', window.__coreLoaded === true],
                ['app.js محمّل', window.__appLoaded === true],
                ['$ (getElementById)', typeof window.$ === 'function'],
                ['showToast', typeof window.showToast === 'function'],
                ['generateSalt', typeof window.generateSalt === 'function'],
                ['saveSession', typeof window.saveSession === 'function'],
                ['checkLogin', typeof window.checkLogin === 'function'],
                ['navigateTo', typeof window.navigateTo === 'function'],
                ['init', typeof window.init === 'function'],
                ['ROLES', typeof window.ROLES === 'object'],
                ['المستخدمين', window.users ? window.users.length : 0]
            ];
            
            let html = '<h2>نتائج الاختبار:</h2>';
            tests.forEach(function(t) {
                const icon = t[1] ? '✅' : '❌';
                const color = t[1] ? 'green' : 'red';
                html += '<div style="color:' + color + '; font-size: 18px; padding: 5px 0;">' + icon + ' ' + t[0] + ' = ' + t[1] + '</div>';
            });
            
            html += '<br><hr><br>';
            html += '<div style="color:blue;">عدد الدوال:', Object.keys(window).filter(k => typeof window[k] === 'function').length, '</div>';
            html += '<div style="color:blue;">عدد المستخدمين:', window.users ? window.users.length : '?', '</div>';
            
            r.innerHTML = html;
            
            // اطبع في console
            tests.forEach(function(t) {
                console.log((t[1] ? '✅' : '❌') + ' ' + t[0] + ':', t[1]);
            });
        }, 1000);
    </script>
</body>
</html>
